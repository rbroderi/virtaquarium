<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roku Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { display: block; width: 100%; height: 100%; object-fit: contain; }
  #hud { position: fixed; left: 12px; top: 10px; color: #eaf6ff; font: 13px/1.5 ui-monospace, Consolas, monospace;
         text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
  #error { position: fixed; inset: 0; display: none; place-items: center; color: #eaf6ff; background: #0b3a4a;
           font: 16px/1.6 system-ui, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud"></div>
<div id="error"></div>
<script type="module" src="./src/roku.js"></script>
</body>
</html>
