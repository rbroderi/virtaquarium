<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Aquarium</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3a4a; font-family: system-ui, 'Segoe UI', sans-serif; color: #eaf6ff; }
  canvas#tank { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  /* Soft vignette like looking through aquarium glass */
  #glass { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 12, 24, 0.45) 100%); }
  #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px; background: rgba(0, 20, 30, 0.45); font-size: 14px; transition: opacity 2s; pointer-events: none; }
  #hint.fade { opacity: 0; }
  #help { position: fixed; top: 20px; left: 20px; padding: 14px 18px; border-radius: 12px; background: rgba(0, 20, 30, 0.7); font-size: 14px; line-height: 1.7; display: none; }
  #help.show { display: block; }
  #help kbd { display: inline-block; min-width: 18px; padding: 0 6px; margin-right: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); text-align: center; }
  #tags { position: fixed; inset: 0; pointer-events: none; display: none; }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: rgba(0, 25, 35, 0.55); }
  .tag.sel { background: rgba(255, 200, 80, 0.75); color: #111; }
  #brain { position: fixed; top: 20px; right: 20px; width: 290px; padding: 16px 18px; border-radius: 14px; background: rgba(4, 24, 34, 0.78); backdrop-filter: blur(6px); font-size: 13px; display: none; }
  #brain.show { display: block; }
  #brain h2 { margin: 0; font-size: 20px; }
  #brain h3 { margin: 12px 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9fc8dc; }
  #brain .sp { color: #bfe0ee; margin-bottom: 8px; }
  #brain .sp em { color: #8fb2c4; }
  #brain .thought { font-size: 15px; color: #ffe7a8; }
  #brain .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #brain .row span { width: 110px; flex: none; color: #cfe6f2; }
  #brain .bar { flex: 1; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  #brain .bar i { display: block; height: 100%; background: #5cc8ff; }
  #brain .bar.hunger i { background: #ff9a4a; } #brain .bar.energy i { background: #7ee08a; } #brain .bar.fear i { background: #ff5a6a; }
  #brain .bar.social i { background: #c49aff; } #brain .bar.boredom i { background: #e8d36a; }
  #brain .bar.trait i { background: #8fb2c4; } #brain .bar.opt i { background: #4a7a90; } #brain .bar.on i { background: #ffd36a; }
  #brain .fact { color: #a9c9d8; font-size: 12px; line-height: 1.5; margin: 12px 0 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="tank"></canvas>
<div id="glass"></div>
<div id="tags"></div>
<div id="brain"></div>
<div id="hint">Click to feed · click a fish to see its brain · H for help</div>
<div id="help">
  <div><kbd>click</kbd>drop food (or select a fish)</div>
  <div><kbd>Tab</kbd>inspect next fish's brain</div>
  <div><kbd>B</kbd>show every fish's current thought</div>
  <div><kbd>F</kbd>feed</div>
  <div><kbd>N</kbd>toggle lights (day / night)</div>
  <div><kbd>Space</kbd>pause</div>
  <div><kbd>Esc</kbd>close brain panel</div>
  <div><kbd>F11</kbd>full screen</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
