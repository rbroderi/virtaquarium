<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b2a3a; overflow: hidden; font: 13px system-ui, sans-serif; color: #cfe6f0; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 12px; top: 10px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: calc(100vw - 24px); }
  #bar { background: rgba(0, 20, 30, 0.6); padding: 6px 10px; border-radius: 6px; }
  #bar select, #bar input { vertical-align: middle; }
  #refcv { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #refcv.active { pointer-events: auto; cursor: crosshair; }
  #refbar { max-width: 560px; background: rgba(0, 20, 30, 0.75); padding: 6px 10px; border-radius: 6px; }
  #refbar .row { margin: 3px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #refbar input[type=number] { width: 52px; }
  #refout { margin: 4px 0 0; max-height: 40vh; overflow: auto; font: 12px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sw { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; border: 1px solid #0008; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three-mesh-bvh": "/node_modules/three-mesh-bvh/src/index.js"
} }
</script>
</head>
<body>
<canvas id="lab"></canvas>
<div id="ui">
<div id="bar">
  <select id="sp"></select>
  <label><input type="checkbox" id="swim" checked> swim</label>
  <label><input type="checkbox" id="spin"> spin</label>
  <label title="procedural (left) vs pc/models/fish/&lt;id&gt;.glb (right)"><input type="checkbox" id="compare"> compare</label>
  <label>yaw <input type="range" id="yaw" min="-180" max="180" value="0"></label>
  <label>light <input type="range" id="light" min="0" max="100" value="100"></label>
  <select id="rig" title="light rig"><option value="sun">sun</option><option value="led">LED bar</option></select>
  <select id="tone" title="tone mapping"><option value="aces">ACES</option><option value="neutral">Neutral</option><option value="agx">AgX</option><option value="none">none</option></select>
  <label><input type="checkbox" id="ref"> reference</label>
  <button id="shot" title="download what is on screen as PNG">screenshot</button>
</div>
<!-- Reference-photo tooling (pc/src/labRef.js): shown when "reference" is ticked or ?ref=1. -->
<div id="refbar" hidden>
  <div class="row">
    <select id="refsel" title="reference photo"></select>
    <select id="refview" title="how the photo is shown"><option value="wipe">wipe</option><option value="blend">blend</option><option value="photo">photo</option><option value="render">render</option></select>
    <input type="range" id="refmix" min="0" max="100" value="50" title="wipe position / blend amount">
    <label title="photo fish faces left"><input type="checkbox" id="refmirror"> mirror</label>
  </div>
  <div class="row">
    <label>pitch <input type="number" id="refpitch" min="-60" max="60" step="1" value="0"></label>
    <label title="in-plane photo rotation, degrees">rot <input type="number" id="refrot" min="-90" max="90" step="1" value="0"></label>
    <label>fov <input type="number" id="reffov" min="5" max="90" step="1" value="30"></label>
    <label>sun az <input type="number" id="refaz" min="-180" max="180" step="5" value="23"></label>
    <label>el <input type="number" id="refel" min="0" max="90" step="5" value="70"></label>
  </div>
  <div class="row">
    tool
    <label><input type="radio" name="reftool" value="pan" checked> pan/zoom</label>
    <label><input type="radio" name="reftool" value="outline"> outline</label>
    <label><input type="radio" name="reftool" value="patch"> patch</label>
    <input type="text" id="patchname" value="body" size="8" title="name for the next colour patch">
    <input type="number" id="patchr" value="12" min="2" max="200" title="patch radius in photo pixels">
  </div>
  <div class="row">
    <button id="reffit">fit</button>
    <button id="refalign" title="scale/move the photo so its outline matches the render's silhouette">align</button>
    <button id="refmeasure">measure</button>
    <button id="refundo" title="remove last outline point (Backspace)">undo pt</button>
    <button id="refclear">clear</button>
    <button id="refsave" title="save photo + refs.json to pc/ref/&lt;species&gt;/">save</button>
  </div>
  <pre id="refout">Drop a side-on photo here, or put photos and refs.json in pc/ref/&lt;species&gt;/.</pre>
</div>
</div>
<canvas id="refcv"></canvas>
<script type="module" src="./src/lab.js"></script>
</body>
</html>
