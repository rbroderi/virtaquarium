# pnpm 11 refuses to install until every dependency with an install script is
# either allowed or denied here. Add new entries with `pnpm approve-builds`.
allowBuilds:
  "@roku-sdk/tooling": true
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false

# Security floors for transitive dependencies (jest, eslint) that still ask for
# vulnerable ranges. Drop each once upstream requires a patched version.
overrides:
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
  "uuid@<11.1.1": ^11.1.1
